    reading_guide: |
      # Session 1 readings

      ## Required Readings

      - Chatsiou, K. & Jankin Mikhaylov, S., "Deep Learning for Political Science", in
        *The SAGE Handbook of Research Methods in Political Science and International
        Relations*. Available through the Hertie library.

