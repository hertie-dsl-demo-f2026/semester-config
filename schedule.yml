# INSTRUCTOR-OWNED - yours to edit freely; edits here are not overwritten.
#
# This semester's plan: one block per kind (lectures, labs, readings, exams, events, assets),
# each a map whose KEY names what the toolkit makes for the entry (its site row, its ids; an
# assignment's repos and mark sheet) and is never displayed or read for a number.
#   session         the teaching unit (integer): REQUIRED on lectures and labs; optional on
#                   readings (absent = a standalone row)
#   number          optional, default = session: the row word ("Lab 2"); REQUIRED on assignments
#   event_datetime  a datetime, `tbc`, or a list of slots {at, location, details}
#   files           from_course_repo, from_path, to_semester_repo, to_path, release_datetime
# The term's own dates are the `semester:` block, each entry with a `type`: start, end,
# break (`from`/`to`) or archive. Field reference: docs/07-schedule-releases.md.

semester:
  start:
    type: start
    event_datetime: 2026-08-04
  end:
    type: end
    event_datetime: 2026-11-13
  archive:
    type: archive
    event_datetime: 2027-01-12
    show_on_site: true
    details: 'This semester is archived on {date}: every repository in it becomes read-only. You keep read access, so you can still fork or clone anything you want to keep working on into your own account.'
lectures:
  lecture-01:
    session: 1
    title: Deep learning in public policy
    details: What deep learning is, where it already sits in public-sector decision making, and what this course will and will not claim for it.
    event_datetime: 2026-08-04T10:00
    files:
      - from_course_repo: course-materials-f2026
        from_path: lectures/01_deep-learning-in-public-policy
        release_datetime: 2026-08-04T08:00
  lecture-02:
    session: 2
    title: Deep neural networks (1)
    details: Perceptrons, activation functions and the forward pass; why depth buys representational power.
    event_datetime: 2026-08-11T10:00
    files:
